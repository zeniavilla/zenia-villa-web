<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zenia Villa — Senior Software Engineer with a focus on frontend, building for the AI era." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Zenia Villa | Senior Software Engineer</title>
    <!--
      SPA redirect for GitHub Pages + React Router (BrowserRouter).
      When GitHub Pages can't find a file it serves this 404.html.
      This script encodes the path into the query string and redirects
      to the root index.html, which then restores the path via history.replaceState.
      segmentCount = 0 since this is on a custom domain (not a project page).
    -->
    <script>
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(0).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
