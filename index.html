    <!--
      Decode the GitHub Pages 404 redirect and restore the correct URL.
      Paired with public/404.html which encodes the path as a query string.
    -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            decoded.slice(1).join('&') + (l.hash || '')
          );
        }
      }(window.location));
    </script>
